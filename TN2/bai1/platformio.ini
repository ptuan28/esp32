platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:vd1_delay]
build_src_filter = -<*> +<vd1_dung_delay.cpp>

[env:vd2_millis]
build_src_filter = -<*> +<vd2_non_blocking.cpp>

[env:vd3_timer]
